description: >-
  Securian Financial Group is a Minnesota-based mutual holding company providing life
  insurance, annuities, retirement plan solutions, investment management, group and
  workplace benefits, and credit-union and bank insurance programs to individuals,
  employers and financial institutions. Securian runs production API infrastructure —
  a Kong gateway at api.securian.com and AWS API Gateway hosts at api.connect.securian.com
  and api.lifebenefits.com — and markets API integrations through Securian Platform Connect
  (group benefits, aligned to LIMRA LDEx EOIS and BEM) and FlexTech (embedded payment
  protection for digital lenders), but publishes no developer portal, no API contract and
  no SDK. Its only anonymously readable machine-readable document is the OpenID Connect /
  OAuth 2.0 discovery metadata served by its PingFederate authorization server at
  sso.securian.com.
