  machine-readable documents Securian serves and are directly verifiable. The insurance
  domain-standard entries are FIRST-PARTY PROSE CLAIMS on securian.com — Securian says it
  aligns its API connections to LIMRA's LDEx standards — and there is no published contract
  to check them against, so each carries contract_evidence: none. Nothing here is inferred
  from a spec we do not have.
