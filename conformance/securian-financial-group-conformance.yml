domain_standard:
  id: ldex
  label: LIMRA Data Exchange (LDEx) Standards
  body: LIMRA
  body_url: https://www.limra.com/en/solutions-and-services/data-exchange-standards/ldex-overview/
  declared_in_contract: false
  claimed_by_provider: true
  contract_evidence: none
  evidence: https://www.securian.com/employers/flexible-administration/strategic-partnerships/securian-platform-connect.html
  quote: >-
    "Securian Financial is prioritizing API connections that align with LDEx, LIMRA's
    standardized data exchange format."
  profiles:
    - id: ldex-eois
      label: LDEx Evidence of Insurability Status (EOIS)
      conforms: claimed
      contract_evidence: none
      evidence: >-
        Securian Platform Connect page names the EOIS standard and describes "EOI decisions
        reflected via API".
    - id: ldex-bem
      label: LDEx Benefits Enrollment Management (BEM)
      conforms: claimed
      contract_evidence: none
      evidence: >-
        Securian Platform Connect page names BEM as supporting "standardized enrollment data
        exchange between benefits administration platforms". LDEx BEM 2.0 defines REST API
        transmission, which is consistent with the auth-gated AWS API Gateway hosts
        (api.connect.securian.com, api.lifebenefits.com) probed for this record.
  note: >-
    LDEx is not currently in the insurance regime's standards[] list in scoring.yml, which
    carries the ACORD family (acord, acord-al3, acord-xml, ngds, grlc, cieca-bms, csio,
    market-reform-contract). LDEx is the US group-benefits/workplace-benefits data-exchange
    standard and is the one this provider actually names; worth adding upstream.
gaps:
  - >-
    No published compliance program, certification list (SOC 2 / ISO 27001 / PCI / HIPAA),
    or trust center. https://www.securian.com/about-us/sustainability/inspiring-trust/cybersecurity-and-data-privacy.html
    (HTTP 200) describes practices in prose and names no framework, so no Compliance pointer
    is emitted for this record.
  - >-
    The LDEx alignment cannot be verified without a contract. If Securian published the
    OpenAPI behind Securian Platform Connect, domain_standard_conformance would move from a
    prose claim to a checkable one.
